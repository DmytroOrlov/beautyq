postgres {
  jdbcDriver = "org.postgresql.Driver"
  url = "jdbc:postgresql://{host}:{port}/postgres"
  user = "postgres"
  password = "postgres"
  host = "localhost"
  port = 5432
}

# Default Elasticsearch coordinates. Under `scene:managed` the dockerized container overrides these
# with its mapped port; the local managed search bootstrap depends on the ES client, so this default
# lets the config bind resolve in non-docker scenes where the BeautyQ search route is not served.
elasticsearch {
  host = "localhost"
  port = 9200
}

llama-cpp-embedding {
  baseUrl = "http://localhost:8081"
  baseUrl = ${?M18_QDRANT_EMBEDDING_ENDPOINT}
  endpointPath = "/v1/embeddings"
}

logger {
  levels = {}
  json = false
}
